<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />
    <title>ShinedeWake</title>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
    <script>
      // Preserve the cleanup of the retired root PWA on desktop deployments.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          void (async () => {
            const wakeScope = `${window.location.origin}/`;
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations.filter((registration) => registration.scope === wakeScope)
                .map((registration) => registration.unregister())
            );
            if ("caches" in window) {
              const cacheNames = await window.caches.keys();
              await Promise.all(
                cacheNames.filter((name) => name.startsWith("shinedewake-shell-"))
                  .map((name) => window.caches.delete(name))
              );
            }
          })().catch(() => undefined);
        });
      }
      try {
        window.localStorage.removeItem("shinedewake.pending-actions.v1");
      } catch {
        // Storage is optional.
      }
    </script>
  </body>
</html>
